# CI de branche : lint et suite hors ligne sur les trois OS. Porte de fusion des runs autonomes
# (ARCHITECTURE-SPINE.md, Deferred : « une CI de branche s'ajoute avant le premier »).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked --group train
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
