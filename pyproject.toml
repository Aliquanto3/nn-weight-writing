[project]
name = "nn-weight-writing"
version = "0.1.0"
description = "Un LLM écrit tous les poids d'un réseau de neurones, sans entraînement, comparé aux règles en code, à l'entraînement standard, à l'édition de poids et au steering"
readme = "README.md"
authors = [{ name = "Anaël Yahi" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
keywords = ["neural-networks", "weight-writing", "interpretability", "llm"]
# Dépendances ajoutées par `uv add` au fil des stories, jamais figées de mémoire.
dependencies = [
    "anthropic>=2.6.0",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "openai>=3.46.0",
]

[project.scripts]
nnww = "nn_weight_writing.cli:main"

[project.urls]
Homepage = "https://github.com/Aliquanto3/nn-weight-writing"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"
# Code tiers installé (BMAD, agent-cost-kit) : hors de nos règles de style.
# Code de B copié tel quel des séances gelées (rapport du lot 1) : pas reformaté.
extend-exclude = [".claude", "_bmad", "docs/rapport-lot1/b"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short --strict-markers -m 'not live'"
markers = [
    "live: appel réel à un service externe (payant ou par abonnement), désélectionné par défaut",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
train = [
    "torch>=2.15.0",
]

# PyTorch CPU sous Linux (la roue PyPI embarque CUDA, plusieurs Go) ; macOS et Windows : roue PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
