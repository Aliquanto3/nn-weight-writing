# Tarifs datés (AD-11), en dollars par million de jetons, par identifiant de modèle.
# cost_equiv_usd = (input × input + output × output + cache_read × cache_read
#                   + cache_write × cache_write) / 1e6, quel que soit le pilote ; la part
#                   écrite en tranche d'une heure au tarif `cache_write_1h` s'il est donné.
# Lu par le seul module nn_weight_writing.config.

[models."claude-sonnet-5-5"]
date = "2026-10-13"
source = "https://platform.claude.com/docs/en/about-claude/pricing, relevé du 2026-10-13 (mémoire de l'utilisateur, prix-cache-sonnet-haiku) ; écriture du cache à 5 minutes"
input = 2.0
output = 10.0
cache_read = 0.10
cache_write = 2.50
# Tranche d'une heure, celle qu'écrit Claude Code (`ephemeral_1h_input_tokens`) : 4,00 $ retrouvé
# en recomposant au micro-dollar `result.total_cost_usd` de Claude Code (docs/experiences/1-8-jouet-sonnet.md).
cache_write_1h = 4.0

