# Protocole d'entraînement des témoins C (AD-17) : architecture de référence fixe par tâche.
# Lu par `baselines/train.py` seul. Les N du jouet sont bornés par la taille du jeu de séance.

[defaults]
optimizer = "adam"
learning_rate = 0.01
epochs = 400
batch_size = 64
n_values = [64, 256]
seeds = [0, 1, 2]

# `hidden` : tailles des couches cachées (activation relu) ; la sortie est une couche dense
# identity à une unité par classe de la tâche.
[tasks.parity]
hidden = [32]

[tasks.compare]
hidden = [16]

[tasks.automaton]
hidden = [32]

# S et S-réservé (1-9 D5, 1-11) : 3 060 × 32 + 32 + 32 × 2 + 2 = 98 018 paramètres pour C ;
# F (entrées `legal.fields@2`, 2 408 valeurs) garde la même couche cachée : 77 154 paramètres.
# `epochs` fixe : N = 32 768 fait 512 pas par époque ; durée relevée par run.
[tasks.legal_s]
hidden = [32]
epochs = 100
n_values = [64, 256, 1024, 8192, 32768]

[tasks.legal_s_reserved]
hidden = [32]
epochs = 100
n_values = [64, 256, 1024, 8192, 32768]

# R (1-13, D9) : architecture de S reprise, aucun réglage choisi sur R ; N_max (taille de
# `data/legal_r/train`) passé à la commande, seulement les N ≤ N_max.
[tasks.legal_r]
hidden = [32]
epochs = 100
n_values = [64, 256]
