# Protocole d'écriture (protocole-ecriture.md, AD-6). Lu par le seul module nn_weight_writing.config.
# Toute modification après la première séance mesurée invalide les séances déjà faites
# et se consigne comme décision (recalibrage unique après le jouet).

[session]
# Passes par séance, identiques pour A et B et à toutes les tailles.
pass_budget = 20
# Plafond de tours d'une séance (fin `turn_limit`).
turn_limit = 200
# Délai maximal d'une exécution dans le bac à sable, en secondes.
exec_timeout_s = 60
# Durée maximale d'une séance Claude Code, en secondes : au-delà, `claude` est tué (fin `error`).
session_timeout_s = 7200
# Tentatives de gel par séance (refus au-delà).
max_freeze_attempts = 3

[journal]
# Version du schéma des événements de journal.jsonl (AD-7).
schema_version = 1

[budget]
# Plafonds sur le seul coût facturé (AD-11), en dollars ; le coût équivalent API ne s'y impute pas.
# Plafond de séance : réservé à l'ouverture, arrêt `money_budget` dès qu'il est atteint.
max_session_usd = 5.0
# Plafond du projet (SPEC.md : 200 $ facturés, tous lots).
project_cap_usd = 200.0

[budget.lot_caps_usd]
# Plafonds par lot (SPEC.md : lot 1 100 $, lot 2 75 $, lot 3 25 $).
1 = 100.0
2 = 75.0
3 = 25.0
